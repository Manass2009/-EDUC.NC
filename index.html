<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EDUC National</title>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 880px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* Images plein écran */
    .fullscreen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Bouton Suivant remonté */
    .btn-overlay {
      position: absolute;
      bottom: 60px; /* Remonté pour être bien visible sur mobile */
      left: 5%;
      width: 90%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #1890ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(24, 144, 255, 0.4);
      text-align: center;
    }

    .btn-overlay:active {
      transform: scale(0.98);
    }

    /* --- FORMULAIRES DE CONNEXION / INSCRIPTION --- */
    .auth-container {
      padding: 40px 24px 30px 24px;
      text-align: center;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
      z-index: 10;
      overflow-y: auto;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a253c;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: #6b7c96;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* Photo de profil avec le bouton + */
    .photo-upload-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .photo-upload-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #e6f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border: 2px dashed #0056b3;
    }

    .photo-upload-btn img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .plus-icon {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #1890ff;
      color: white;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Champs de saisie */
    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #0056b3;
    }

    .btn-primary-form {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #0056b3;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    /* --- DASHBOARD INTÉRIEUR DE L'APPLICATION --- */
    .dashboard-header {
      background: #0056b3;
      color: white;
      padding: 20px;
      border-radius: 0 0 20px 20px;
    }

    .user-profile-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div class="app-container">

  <div class="screen active" id="screen-1">
    <img src="logo.png" class="fullscreen-img" alt="EDUC Splash">
  </div>

  <div class="screen" id="screen-2">
    <img src="bg-flag.jpg" class="fullscreen-img" alt="Bienvenue">
    <button class="btn-overlay" onclick="nextScreen('screen-3')">Suivant</button>
  </div>

  <div class="screen" id="screen-3">
    <img src="onboarding-quiz.png" class="fullscreen-img" alt="Quiz">
    <button class="btn-overlay" onclick="nextScreen('screen-auth-choice')">Suivant</button>
  </div>

  <div class="screen" id="screen-auth-choice">
    <div class="auth-container">
      <div style="margin-top: 30px;">
        <div style="font-size: 50px; margin-bottom: 10px;">👤➕</div>
        <h2 class="auth-title">Créer un compte</h2>
        <p class="auth-subtitle">Rejoignez EDUC National et commencez votre parcours d'apprentissage.</p>

        <button class="btn-primary-form" style="background: #1890ff; margin-top: 25px;" onclick="nextScreen('screen-phone-form')">
          📱 Continuer avec le téléphone
        </button>

        <div style="margin: 20px 0; color: #94a3b8; font-size: 13px;">OU</div>

        <div id="googleBtnWrapper" style="display: flex; justify-content: center;"></div>
      </div>

      <div style="font-size: 14px; color: #64748b; margin-top: 20px;">
        Vous avez déjà un compte ? <a href="#" style="color: #0056b3; font-weight: bold; text-decoration: none;">Se connecter</a>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-phone-form">
    <div class="auth-container">
      <div>
        <h2 class="auth-title">Inscription</h2>
        <p class="auth-subtitle">Complétez vos informations pour accéder à l'application.</p>

        <div class="photo-upload-wrapper">
          <div class="photo-upload-btn" onclick="document.getElementById('photoInput').click()">
            <span id="avatarPlaceholder" style="font-size: 32px; color: #0056b3;">👤</span>
            <img id="avatarPreview" alt="Aperçu" />
            <div class="plus-icon">+</div>
          </div>
          <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="previewPhoto(event)" />
        </div>

        <div class="input-group">
          <label>Nom</label>
          <input type="text" id="inputNom" placeholder="Ex: KABAMBA" />
        </div>

        <div class="input-group">
          <label>Post-nom</label>
          <input type="text" id="inputPostNom" placeholder="Ex: MUKENDI" />
        </div>

        <div class="input-group">
          <label>Numéro de téléphone</label>
          <input type="tel" id="inputPhone" value="+243 " placeholder="+243 812345678" />
        </div>

        <button class="btn-primary-form" onclick="validerInscription()">Accéder à l'application</button>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-dashboard" style="background: #f8fafc;">
    <div class="dashboard-header">
      <div class="user-profile-bar">
        <img id="dashAvatar" class="user-avatar" src="https://via.placeholder.com/48?text=User" alt="User" />
        <div>
          <div style="font-size: 12px; opacity: 0.85;">Bienvenue 👋</div>
          <div id="dashUserName" style="font-size: 18px; font-weight: bold;">Utilisateur</div>
        </div>
      </div>
    </div>

    <div style="padding: 20px;">
      <h3 style="margin-bottom: 12px; color: #1e293b; font-size: 16px;">Votre progression</h3>
      <div style="background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 24px;">
        <div style="background: #eab308; width: 65%; height: 100%;"></div>
      </div>

      <h3 style="margin-bottom: 12px; color: #1e293b; font-size: 16px;">Menu principal</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div style="background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
          <span style="font-size: 30px;">📚</span>
          <div style="font-weight: bold; margin-top: 8px; color: #1e293b;">Mes Cours</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
          <span style="font-size: 30px;">❓</span>
          <div style="font-weight: bold; margin-top: 8px; color: #1e293b;">Mes Quiz</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // Splash screen vers l'onboarding après 2.5s
  setTimeout(() => {
    nextScreen('screen-2');
  }, 2500);

  function nextScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Prévisualisation photo uploadée
  function previewPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('avatarPreview');
        img.src = e.target.result;
        img.style.display = 'block';
        document.getElementById('avatarPlaceholder').style.display = 'none';
        document.getElementById('dashAvatar').src = e.target.result;
      }
      reader.readAsDataURL(file);
    }
  }

  // Validation formulaire vers le tableau de bord
  function validerInscription() {
    const nom = document.getElementById('inputNom').value.trim();
    const postNom = document.getElementById('inputPostNom').value.trim();
    
    if (!nom) {
      alert("Veuillez entrer au moins votre nom.");
      return;
    }

    document.getElementById('dashUserName').innerText = nom + ' ' + postNom;
    nextScreen('screen-dashboard');
  }

  // Google Sign-In
  window.onload = function () {
    if (window.google) {
      google.accounts.id.initialize({
        client_id: "VOTRE_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
        callback: handleGoogleResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleBtnWrapper"),
        { theme: "outline", size: "large", text: "continue_with" }
      );
    }
  };

  function handleGoogleResponse(response) {
    const responsePayload = parseJwt(response.credential);
    document.getElementById('dashUserName').innerText = responsePayload.name;
    document.getElementById('dashAvatar').src = responsePayload.picture;
    nextScreen('screen-dashboard');
  }

  function parseJwt(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }
</script>

</body>
</html>
