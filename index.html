<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUC National</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Cadre de l'application mobile pleine hauteur */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .screen.active {
            display: block;
        }

        /* Images plein écran */
        .fullscreen-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Bouton transparent placé exactement sur le bouton "Suivant/Commencer" de tes images */
        .click-area {
            position: absolute;
            bottom: 40px;
            left: 5%;
            width: 90%;
            height: 60px;
            cursor: pointer;
            z-index: 10;
        }

        /* Style de la page Créer un compte */
        .auth-container {
            padding: 50px 24px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .auth-icon {
            width: 90px;
            height: 90px;
            margin: 40px auto 20px;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a253c;
        }

        .auth-desc {
            color: #6b7c96;
            font-size: 14px;
            margin-top: 10px;
            padding: 0 10px;
        }

        .btn-phone {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #1890ff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
        }

        .divider {
            margin: 25px 0;
            color: #a0aec0;
            font-size: 13px;
            display: flex;
            align-items: center;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .btn-google {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-footer {
            margin-bottom: 20px;
            font-size: 14px;
            color: #4a5568;
        }

        .auth-footer a {
            color: #1890ff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="screen active" id="screen-1">
        <img src="logo.png" class="fullscreen-img" alt="EDUC Splash">
    </div>

    <div class="screen" id="screen-2">
        <img src="bg-flag.jpg" class="fullscreen-img" alt="Bienvenue">
        <div class="click-area" onclick="nextScreen('screen-3')"></div>
    </div>

    <div class="screen" id="screen-3">
        <img src="questionnaire d'intégration.png" class="fullscreen-img" alt="Quiz">
        <div class="click-area" onclick="nextScreen('screen-auth')"></div>
    </div>

    <div class="screen" id="screen-auth">
        <div class="auth-container">
            <div>
                <svg class="auth-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 14C17.6667 14 23 15.3333 23 18V20H7V18C7 15.3333 12.3333 14 15 14ZM15 12C12.7909 12 11 10.2091 11 8C11 5.79086 12.7909 4 15 4C17.2091 4 19 5.79086 19 8C19 10.2091 17.2091 12 15 12ZM6 8V5H4V8H1V10H4V13H6V10H9V8H6Z" fill="#0052cc"/>
                </svg>

                <h2 class="auth-title">Créer un compte</h2>
                <p class="auth-desc">Rejoignez EDUC National et commencez votre parcours d'apprentissage.</p>

                <button class="btn-phone" onclick="alert('Module téléphone')">
                    📱 Continuer avec le téléphone
                </button>

                <div class="divider">OU</div>

                <button class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                    Continuer avec Google
                </button>
            </div>

            <div class="auth-footer">
                Vous avez déjà un compte ? <a href="#">Se connecter</a>
            </div>
        </div>
    </div>

</div>

<script>
    // Redirection automatique de l'écran 1 vers l'écran 2 après 2.5 secondes (2500 ms)
    setTimeout(() => {
        nextScreen('screen-2');
    }, 2500);

    function nextScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
